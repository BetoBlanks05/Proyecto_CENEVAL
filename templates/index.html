<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Evaluación Adaptativa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

<div class="platform-container">
    <header class="exam-header">
        <div class="header-top">
            <div class="brand-area">
                <span class="system-label">Evaluación Tipo CENEVAL</span>
                <h2 id="topic-title" class="module-title">Inicializando Módulo...</h2>
            </div>
            <div class="status-area">
                <div class="metric-group">
                    <span class="metric-label">Avance del Módulo</span>
                    <span id="topic-progress-badge" class="metric-value">0%</span>
                </div>
                <div class="metric-group">
                    <span class="metric-label">Progreso Global</span>
                    <span id="progress-badge" class="metric-value">0%</span>
                </div>
            </div>
        </div>
        <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </header>

    <main class="exam-body">
        <div id="main-content">
            <div class="question-header">
                <span class="question-label">Reactivo de Evaluación</span>
                <span id="diff-badge" class="diff-badge hidden"></span>
            </div>
            
            <div id="context-box" class="context-box">Cargando base de conocimiento...</div>
            
            <div class="question-content">
                <h3 id="question-text" class="question-text"></h3>
                
                <div id="options-grid" class="options-list"></div>
            </div>
            
            <div id="feedback-panel" class="feedback-panel"></div>
            
            <div class="exam-footer">
                <button id="next-btn" class="btn-primary" style="display: none;">Siguiente Reactivo &rarr;</button>
            </div>
        </div>

        <div id="results-content" class="hidden">
            <div class="results-header">
                <h2>Dictamen de Evaluación</h2>
                <p>El proceso de evaluación ha concluido. A continuación se presenta el análisis de resultados.</p>
            </div>
            <div id="results-data" class="results-data"></div>
            <div class="results-actions">
                <button onclick="location.reload()" class="btn-secondary">Volver al Inicio</button>
                <button id="download-pdf" class="btn-primary">Generar Reporte PDF</button>
            </div>
        </div>
    </main>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
