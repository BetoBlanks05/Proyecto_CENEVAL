<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Inteligente - Evaluación Adaptativa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="app-container">
    <header class="header" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 id="topic-title" style="margin: 0;">Inicializando Agente...</h2>
            <span id="progress-badge" class="progress-badge">0/0</span>
        </div>
        <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </header>

    <main class="content-area">
        <div id="main-content">
            <div class="meta-info">
                <span id="diff-badge" class="diff-badge hidden"></span>
            </div>
            
            <div id="context-box" class="context-box">Cargando base de conocimiento...</div>
            <h3 id="question-text" class="question-text"></h3>
            
            <div id="options-grid" class="options-grid"></div>
            <div id="feedback-panel" class="feedback-panel"></div>
            
            <button id="next-btn" class="next-btn">Siguiente Pregunta</button>
        </div>

        <div id="results-content" class="hidden">
            <div id="results-data" style="text-align:center; padding: 1rem;">
                </div>
            <div class="results-actions" style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button onclick="location.reload()" class="action-btn restart">Reiniciar Examen</button>
                <button id="download-pdf" class="action-btn pdf">Descargar Resultados (PDF)</button>
            </div>
        </div>
    </main>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
